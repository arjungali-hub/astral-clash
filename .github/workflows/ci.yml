# Every checker, on every push - because 38 of them existed and ran only when
# somebody remembered.
#
# THIS ALSO FIXES THE ONE THING THIS REPO COULD NOT TEST. netcheck launches two
# full Chrome instances, each software-rendering a 3D match through swiftshader;
# leakcheck plays ten rematches; framerateccheck runs two frame-capped arms.
# All three want 1.2-2.2GB free, the development machine has had under 1GB all
# week, and all three have therefore never completed a run. A GitHub runner has
# 16GB. They are not slow here because they are badly written.
#
# TWO JOBS, because a forty-minute suite that blocks every push gets switched
# off. `guards` and `fast` answer in a few minutes and gate the push; `slow`
# runs the heavy checkers on the same push but nobody waits on it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first: nothing is learned from finishing a run
# against a commit that is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # tests/harness.js takes the browser from AC_CHROME. A workflow-level
  # default, so a job that does not override it still finds a browser: the
  # ubuntu runner images ship Chrome at this path.
  #
  # The jobs DO override it, from setup-chrome's chrome-path output - and
  # that output only exists on v2. Pinned at v1, the expression resolved to
  # the EMPTY STRING, which harness.js then treated as "unset" and fell back
  # to a Windows path, so every checker died in about four seconds looking
  # for Chrome in Program Files. Twenty-five of those is the 1m41s the fast
  # job kept taking. harness.js now ignores a blank AC_CHROME rather than
  # obeying it, so this is belt and braces.
  AC_CHROME: /usr/bin/google-chrome

jobs:
  # ---------------------------------------------------------------- guards
  # No browser, no npm install. This is the job that catches "changed one build
  # and not the other", and it should answer in seconds.
  guards:
    name: Build guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Exits non-zero while any user-visible string has no translation. It
      # needs no browser, so it belongs with the guards rather than with the
      # checkers - and it is the thing that catches a string ADDED in English
      # and never translated, which is how the roster stayed English through
      # an entire "localisation is done".
      - name: Everything is translated
        run: python art/i18n_audit.py

      # Exits non-zero if the local build is stale, OR if the two builds differ
      # anywhere without a reason on one of the nine interface lists.
      - name: The two builds agree
        run: python art/sync_local.py --check

      # Exits non-zero if a checker exists that no CI job names, or a CI job
      # names one that does not exist. The lists in this file are written by
      # hand in four places, so a new checker runs only if somebody remembers
      # to add it - and a suite that silently runs one fewer than it reports
      # looks exactly like a suite that passes.
      - name: Every checker actually runs
        run: python art/ci_coverage.py

      # Not a pass/fail gate - a number to watch. If the unkeyed count climbs
      # above 88, something new has no mechanism keeping it in step.
      - name: Coverage map
        run: python art/coverage.py

      # A local that shadows a function its own block calls. Parsing cannot see
      # this - `const t = 1; t('x')` is valid JavaScript and fails at runtime -
      # and it took out the whole online build once, caught by bootcheck only
      # because the shadowed call happened to sit on the path to every match. A
      # text check, so it belongs here rather than with the browser checkers.
      - name: Nothing shadows what it calls
        run: node tests/shadowcheck.js

      - name: Both builds parse
        run: |
          node -e '
            const fs = require("fs"), vm = require("vm");
            let bad = 0;
            for (const p of ["index.html", "local/index.html"]) {
              const s = fs.readFileSync(p, "utf8");
              const re = /<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g;
              let m;
              while ((m = re.exec(s))) {
                try { new vm.Script(m[1]); }
                catch (e) { bad++; console.error(p + ": " + e.message); }
              }
            }
            for (const p of ["shared/common.js", "shared/roster.js", "shared/animation.js",
                             "shared/props.js", "shared/characters.js", "shared/i18n.js",
                             "shared/touch.js", "shared/challenges.js", "shared/account.js",
                             "shared/telemetry.js", "shared/replay.js", "shared/menustage.js",
                             "art/local_extras.js"]) {
              try { new vm.Script(fs.readFileSync(p, "utf8")); }
              catch (e) { bad++; console.error(p + ": " + e.message); }
            }
            process.exit(bad ? 1 : 0);
          '

  # ------------------------------------------------------------------ fast
  # Under a minute each on a real machine. This is the gate.
  fast:
    name: Fast checkers
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Install test deps
        working-directory: tests
        run: npm ci || npm install
      - name: Chrome is really there
        env:
          AC_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node -e "const H=require('./tests/harness');const c=H.chromeCheck();console.log(JSON.stringify(c));if(!c.exists){console.log('::error title=Chrome missing::'+JSON.stringify(c));process.exit(1);}"
          "$AC_CHROME" --version || true
      - name: Run
        env:
          AC_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node tests/run.js --jobs 3 \
            bootcheck smoke localstartcheck localuxcheck localshopcheck \
            layoutcheck keyboardcheck fontcheck consistencycheck routingcheck \
            sandboxcheck batch24check batch38check symmetrycheck weaponcheck \
            deadcontrolcheck inputguardcheck knockbackcheck backguardcheck phonelayoutcheck \
            contrastcheck padmenucheck palettecheck langcheck \
            netsmoothcheck touchfpscheck reconnectcheck dailycheck accountcheck telemetrycheck \
            fpscapcheck replaycheck

  # ------------------------------------------------------------------ slow
  # Minutes each. Sharded three ways and run in parallel: as one job this took
  # 57 minutes to reach sixteen of twenty-one checkers and was then cancelled at
  # the hour with five never run. They are independent processes, so the fix is
  # to run them beside each other rather than to ask for a longer hour.
  #
  # Shards are balanced on MEASURED time from that run, not on name order.
  slow:
    name: Slow checkers (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: guards
    # 75, not 45. The harness's own watchdog is 15 minutes scaled by
    # AC_TIME_SCALE, which is 45 here - so at 45 the job ceiling and the
    # per-run ceiling were the same number, and a single slow checker could
    # eat the entire shard before anything had a chance to report. The inner
    # watchdog should always be the one that fires, because it names the
    # checker and exits cleanly; a job timeout just stops.
    timeout-minutes: 75
    strategy:
      # One shard failing should not cancel the other two - the whole point is
      # to learn about all of them in one push.
      fail-fast: false
      matrix:
        include:
          - shard: heavy
            tests: netcheck leakcheck framerateccheck botcheck
          - shard: match
            tests: controlscheck localcombatcheck localmatchcheck crushcheck swingcheck artcheck
          - shard: rest
            tests: onlineuxcheck coopnetcheck peercheck charcheck teleportcheck mapscheck maptimecheck placementcheck coopdowncheck awaypausecheck stagecheck motioncheck
          # spectatecheck launches THREE browsers, one per client, for the same
          # reason netcheck launches two: Chrome will not run rAF in a
          # background tab and only one window is foreground, so as tabs two of
          # the three would never tick. It gets a shard of its own rather than
          # joining `heavy`, which is already the longest of the three.
          - shard: watch
            tests: spectatecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Install test deps
        working-directory: tests
        run: npm ci || npm install
      - name: Chrome is really there
        env:
          AC_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node -e "const H=require('./tests/harness');const c=H.chromeCheck();console.log(JSON.stringify(c));if(!c.exists){console.log('::error title=Chrome missing::'+JSON.stringify(c));process.exit(1);}"
          "$AC_CHROME" --version || true
      - name: Run
        env:
          AC_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/run.js --jobs 3 ${{ matrix.tests }}

  # ------------------------------------------------------------- css parity
  # On its own, because it is the only checker that compares two commits: it
  # renders an earlier one before it can judge this one (see below).
  cssparity:
    name: CSS parity
    runs-on: ubuntu-latest
    needs: guards
    timeout-minutes: 30
    steps:
      # Every commit, so the one that began this epoch can be found; no file
      # contents until asked for, so finding it does not fetch every version
      # of every model.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Install test deps
        working-directory: tests
        run: npm ci || npm install

      # THE BASELINE IS THE COMMIT THAT BEGAN THIS EPOCH, rendered here.
      #
      # BASELINE_EPOCH (tests/cssparitycheck.js) is bumped in the commit that
      # changes the look on purpose. So within an epoch the computed CSS must
      # not move at all, and this renders the epoch's first commit with the
      # same Chrome on the same machine and compares the commit under test
      # against it. A commit that bumps the epoch compares against itself.
      #
      # It used to be a cache keyed on a hash of index.html, local/index.html
      # and shared/*.js. That fixed a worse fault - an intended change failing
      # this job forever - but it meant any commit that touched those files
      # missed the cache and compared NOTHING. Those are exactly the commits
      # that can break the cascade, so the check never ran when it mattered. A
      # commit that deleted ~170 lines of CSS on the claim that nothing moved
      # was "verified" by this job without one comparison being made.
      - name: Render the commit that began this epoch
        env:
          AC_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          EPOCH_LINE="$(grep -m1 '^const BASELINE_EPOCH' tests/cssparitycheck.js)"
          BASE="$(git log -n 1 --format=%H -S"$EPOCH_LINE" -- tests/cssparitycheck.js)"
          echo "This epoch began at ${BASE:-?}"
          if [ -z "$BASE" ] || [ "$BASE" = "$(git rev-parse HEAD)" ]; then
            echo "This commit declares the epoch: nothing earlier to compare against."
            exit 0
          fi
          git worktree add --detach ../css-base "$BASE"
          ln -s "$GITHUB_WORKSPACE/tests/node_modules" ../css-base/tests/node_modules
          # Measured by THIS commit's checker, so both sides are read the same
          # way: a property added to the checker is recorded for both, and only
          # the game differs between the two renders.
          cp tests/cssparitycheck.js tests/harness.js ../css-base/tests/
          (cd ../css-base && node tests/cssparitycheck.js --save)
          cp ../css-base/tests/.css-baseline.json tests/.css-baseline.json

      - name: Run
        env:
          AC_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/run.js cssparitycheck

      - name: Keep the CSS baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: css-baseline
          path: tests/.css-baseline.json
          if-no-files-found: ignore
